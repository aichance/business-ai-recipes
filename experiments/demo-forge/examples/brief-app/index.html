<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brief App</title>
  </head>
  <body>
    <main>
      <p>Brief App / local run</p>
      <h1>Save a release brief.</h1>
      <label for="brief-input">Brief title</label>
      <input id="brief-input" value="Release Brief" />
      <button id="save-button" type="button">Save brief</button>
      <p id="status">Ready to save</p>
      <section id="result-card" data-state="idle">
        <h2 id="result-title">No brief yet</h2>
        <p id="result-summary">The saved brief will appear here.</p>
      </section>
    </main>
    <script>
      const input = document.querySelector('#brief-input');
      const button = document.querySelector('#save-button');
      const status = document.querySelector('#status');
      const card = document.querySelector('#result-card');
      const title = document.querySelector('#result-title');
      const summary = document.querySelector('#result-summary');

      button.addEventListener('click', async () => {
        const response = await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: input.value })
        });
        const result = await response.json();
        status.textContent = 'Saved';
        card.dataset.state = 'success';
        title.textContent = result.title;
        summary.textContent = result.summary;
      });
    </script>
  </body>
</html>
