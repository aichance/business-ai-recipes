name: LifePilot continuity trial

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'LifePilot public commit SHA (40 lowercase hex characters); downloads only index.html and execution.js'
        required: true
        default: '4710a5ec56dccd9436fec48369d513144306d7de'
        type: string
  pull_request:
    paths:
      - '.github/workflows/lifepilot-trial.yml'
      - 'tools/app-crash-lab/examples/lifepilot-continuity/**'
      - 'tools/app-crash-lab/tests/lifepilot-ci.test.mjs'

permissions:
  contents: read

concurrency:
  group: lifepilot-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-24.04
    container: node:22.16.0-bookworm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/app-crash-lab
    env:
      LIFEPILOT_APP_REF: ${{ inputs.app_ref || '4710a5ec56dccd9436fec48369d513144306d7de' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source guards and process cleanup
        run: node --test tests/lifepilot-ci.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify the public LifePilot scenario and controls
        run: |
          node examples/lifepilot-continuity/ci-trial.mjs \
            --fetch-source --app-ref "$LIFEPILOT_APP_REF" \
            --out "$RUNNER_TEMP/lifepilot-trial"
      - name: Show the measured result
        if: always()
        env:
          TRIAL_OUTPUT: ${{ runner.temp }}/lifepilot-trial
        run: |
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          try {
            const report = JSON.parse(await readFile(`${process.env.TRIAL_OUTPUT}/trial-summary.json`, 'utf8'));
            const text = JSON.stringify(report, null, 2).replaceAll('```', "'''");
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              '## LifePilot continuity trial\n\nSource: public LifePilot static files; fresh local browser contexts and synthetic data.\n\n' +
              'Expected normal checks: 3 PASS. Deliberate changed-goal control: FAIL; wrong-baseline control: INCONCLUSIVE. A green job means these expected outcomes were verified.\n\n' +
              '```json\n' + text + '\n```\n\n' +
              'This run alone does not establish third-party adoption. Inspect the actual run actor and app ownership.\n');
          } catch (error) {
            await appendFile(process.env.GITHUB_STEP_SUMMARY,
              `## Trial incomplete\n\nNo complete summary could be read: ${error.code ?? 'invalid summary'}. Inspect the job log; do not infer a preservation verdict.\n`);
          }
          JS
      - name: Save synthetic results and repeatable tests
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lifepilot-continuity-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lifepilot-trial/trial-summary.json
            ${{ runner.temp }}/lifepilot-trial/source-check.json
            ${{ runner.temp }}/lifepilot-trial/*/report.json
            ${{ runner.temp }}/lifepilot-trial/*/index.html
            ${{ runner.temp }}/lifepilot-trial/*/repro.spec.mjs
            ${{ runner.temp }}/lifepilot-trial/*/playwright.config.mjs
