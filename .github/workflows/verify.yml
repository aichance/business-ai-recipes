name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dots-studio:
    runs-on: ubuntu-latest
    container: node:22.16.0-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test portable extension source
        working-directory: tools/dots-studio
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
  app-forge:
    runs-on: ubuntu-latest
    container: node:22.16.0-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install archive tools
        run: |
          apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends zip unzip
      - name: Generate, build, and test two App Forge routes
        working-directory: tools/app-forge
        run: |
          set -eu
          output="/tmp/app-forge-support-request"
          rm -rf "$output" "$output.zip"
          node forge.mjs --schema fixtures/support-request.schema.json --data fixtures/support-request.data.json --out "$output" --zip "$output.zip"
          node --check "$output/server.mjs"
          (cd "$output" && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test)
          unzip -t "$output.zip"
          output="/tmp/app-forge-release-checklist"
          rm -rf "$output" "$output.zip"
          node forge.mjs --schema fixtures/release-checklist.schema.json --data fixtures/release-checklist.data.json --out "$output" --zip "$output.zip"
          node --check "$output/server.mjs"
          (cd "$output" && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test)
          unzip -t "$output.zip"
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify boundaries and deterministic behavior
        run: python -B verify.py
      - name: Install video tools
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          if not all(shutil.which(tool) for tool in ("ffmpeg", "ffprobe")):
              subprocess.run(["sudo", "apt-get", "-o", "Acquire::Retries=1",
                              "-o", "Acquire::http::Timeout=30", "-o", "Acquire::https::Timeout=30",
                              "update"], check=True, timeout=120)
              subprocess.run(["sudo", "apt-get", "-o", "DPkg::Lock::Timeout=30",
                              "install", "-y", "ffmpeg"], check=True, timeout=180)
          for tool in ("ffmpeg", "ffprobe"):
              subprocess.run([tool, "-version"], check=True, timeout=10,
                             stdout=subprocess.DEVNULL)
          print("Video tools ready; existing installation reused when available")
          PY
      - name: Verify Cutroom media and local HTTP workflow
        run: python3 -B -m unittest discover -s tools/cutroom -p 'test_*.py' -v
      - name: Run the repeat-safe local demonstration
        run: python -B run_demo.py
      - name: Run the offline Jev meeting-line candidate
        run: python -B recipes/meeting-line-judgment/recipe.py
      - name: Run the CSV reconciliation command from the README
        run: python3 -B recipes/csv-to-report/report.py --csv recipes/csv-to-report/sales.csv
      - name: Reproduce the recorded Jev triage offline
        run: python3 -B recipes/jev-support-triage/triage.py --offline
      - name: Compare CSV exception routing offline
        run: python3 -B recipes/jev-csv-exception-routing/route.py --offline
