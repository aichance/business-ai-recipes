name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-forge-first-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install recording dependencies
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
            sudo apt-get -o DPkg::Lock::Timeout=30 install -y ffmpeg
          fi
      - name: Record the published URL quickstart
        shell: bash
        env:
          DEMO_FORGE_CI_OUTPUT: ${{ runner.temp }}/demo-forge-ci
        run: |
          set -euo pipefail
          mkdir -p "$DEMO_FORGE_CI_OUTPUT"
          python experiments/demo-forge/forge.py --doctor > "$DEMO_FORGE_CI_OUTPUT/doctor.json"
          python experiments/demo-forge/examples/brief-app/server.py --port 3000 \
            > "$DEMO_FORGE_CI_OUTPUT/server.log" 2>&1 &
          demo_server_pid=$!
          trap 'kill "$demo_server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 15
          while True:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:3000/", timeout=1) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit("The included app did not become ready")
              time.sleep(0.2)
          PY
          python experiments/demo-forge/forge.py \
            --url http://127.0.0.1:3000/ \
            --operation experiments/demo-forge/examples/brief-app/operation.json \
            --output "$DEMO_FORGE_CI_OUTPUT" \
            --tail-seconds 8
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path(os.environ["DEMO_FORGE_CI_OUTPUT"])
          report = json.loads((output / "run.json").read_text())
          doctor = json.loads((output / "doctor.json").read_text())
          assert doctor["status"] == "ready", doctor
          assert report["status"] == "success", report
          assert report["verified"]["operation_steps"] == 6
          assert "Release Brief is ready" in report["verified"]["success_text"]
          assert report["server"]["managed_by_forge"] is False
          names = ["demo-forge.webm", "demo-forge.mp4", "demo-forge.gif", "cover.png"]
          media = {}
          for name in names:
              data = (output / name).read_bytes()
              assert data, name
              media[name] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          assert sum(item["bytes"] for item in media.values()) < 20_000_000
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "json", str(output / "demo-forge.mp4")
          ], text=True))
          duration = float(probe["format"]["duration"])
          assert 8 <= duration <= 30, duration
          result = {"status": "success", "operation_steps": 6, "mp4_seconds": duration,
                    "media": media, "input": "included synthetic Brief app",
                    "scope": "fresh CI dependency setup; not third-party adoption"}
          (output / "verification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Demo Forge first run\n\n")
              summary.write(f"Six UI steps verified; MP4 duration: {duration:.2f} seconds.\n\n")
              summary.write("Download the demo-forge-first-run artifact below for MP4, GIF, "
                            "WebM, cover, run report and measured verification.\n\n")
              summary.write("Input: included synthetic Brief app. This verifies CI setup "
                            "and recording, not third-party adoption or arbitrary apps.\n")
          PY
      - name: Save the checked recording
        uses: actions/upload-artifact@v5
        with:
          name: demo-forge-first-run
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/demo-forge-ci/demo-forge.webm
            ${{ runner.temp }}/demo-forge-ci/demo-forge.mp4
            ${{ runner.temp }}/demo-forge-ci/demo-forge.gif
            ${{ runner.temp }}/demo-forge-ci/cover.png
            ${{ runner.temp }}/demo-forge-ci/run.json
            ${{ runner.temp }}/demo-forge-ci/doctor.json
            ${{ runner.temp }}/demo-forge-ci/verification.json
  dots-studio:
    runs-on: ubuntu-latest
    container: node:22.16.0-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test portable extension source
        working-directory: tools/dots-studio
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
  app-forge:
    runs-on: ubuntu-latest
    container: node:22.16.0-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install archive tools
        run: |
          apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends zip unzip
      - name: Generate, build, and test two App Forge routes
        working-directory: tools/app-forge
        run: |
          set -eu
          output="/tmp/app-forge-support-request"
          rm -rf "$output" "$output.zip"
          node forge.mjs --schema fixtures/support-request.schema.json --data fixtures/support-request.data.json --out "$output" --zip "$output.zip"
          node --check "$output/server.mjs"
          (cd "$output" && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test)
          unzip -t "$output.zip"
          output="/tmp/app-forge-release-checklist"
          rm -rf "$output" "$output.zip"
          node forge.mjs --schema fixtures/release-checklist.schema.json --data fixtures/release-checklist.data.json --out "$output" --zip "$output.zip"
          node --check "$output/server.mjs"
          (cd "$output" && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test)
          unzip -t "$output.zip"
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify boundaries and deterministic behavior
        run: python -B verify.py
      - name: Install video tools
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          if not all(shutil.which(tool) for tool in ("ffmpeg", "ffprobe")):
              subprocess.run(["sudo", "apt-get", "-o", "Acquire::Retries=1",
                              "-o", "Acquire::http::Timeout=30", "-o", "Acquire::https::Timeout=30",
                              "update"], check=True, timeout=120)
              subprocess.run(["sudo", "apt-get", "-o", "DPkg::Lock::Timeout=30",
                              "install", "-y", "ffmpeg"], check=True, timeout=180)
          for tool in ("ffmpeg", "ffprobe"):
              subprocess.run([tool, "-version"], check=True, timeout=10,
                             stdout=subprocess.DEVNULL)
          print("Video tools ready; existing installation reused when available")
          PY
      - name: Verify Cutroom media and local HTTP workflow
        run: python3 -B -m unittest discover -s tools/cutroom -p 'test_*.py' -v
      - name: Run the repeat-safe local demonstration
        run: python -B run_demo.py
      - name: Run the offline Jev meeting-line candidate
        run: python -B recipes/meeting-line-judgment/recipe.py
      - name: Run the CSV reconciliation command from the README
        run: python3 -B recipes/csv-to-report/report.py --csv recipes/csv-to-report/sales.csv
      - name: Reproduce the recorded Jev triage offline
        run: python3 -B recipes/jev-support-triage/triage.py --offline
      - name: Compare CSV exception routing offline
        run: python3 -B recipes/jev-csv-exception-routing/route.py --offline
