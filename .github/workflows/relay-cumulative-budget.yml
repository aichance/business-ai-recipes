name: Relay cumulative budget comparison

on:
  pull_request:
    paths:
      - 'experiments/relay-cumulative-budget/**'
      - '.github/workflows/relay-cumulative-budget.yml'
  push:
    branches: [main, 'codex/relay-cumulative-budget-*']
    paths:
      - 'experiments/relay-cumulative-budget/**'
      - '.github/workflows/relay-cumulative-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-cumulative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build the pinned registry source and test it
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOSUMDB: ''
          GONOPROXY: ''
        run: |
          set -euo pipefail
          go mod download -json github.com/phrypy/dropped@v0.1.2-0.20260617042836-06536a1ee332 > "$RUNNER_TEMP/dropped-module.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "dropped-module.json").read_text())
          assert data["Origin"]["Hash"] == "06536a1ee332f14073df87fdd0a628a61c6ebf5c"
          assert data["Origin"]["URL"] == "https://github.com/phrypy/dropped"
          assert data["Sum"].startswith("h1:") and data["GoModSum"].startswith("h1:")
          PY
          source_dir="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"dropped-module.json")))["Dir"])')"
          cd "$source_dir"
          go test ./...
          go vet ./...
          go build -mod=readonly -ldflags '-X main.version=06536a1ee332f14073df87fdd0a628a61c6ebf5c' -o "$RUNNER_TEMP/dropped" .
      - name: Install exact official Codex into a temporary prefix
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/relay-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.164.0
      - name: Compare actual static CLI output and native zero-turn inspection
        shell: bash
        run: |
          set -euo pipefail
          comparison_exit=0
          python -B experiments/relay-cumulative-budget/check.py --scratch-parent "$RUNNER_TEMP" --codex-bin-dir "$RUNNER_TEMP/relay-codex/node_modules/.bin" --dropped "$RUNNER_TEMP/dropped" > "$RUNNER_TEMP/relay-cumulative-result.json" || comparison_exit=$?
          if [ ! -s "$RUNNER_TEMP/relay-cumulative-result.json" ]; then
            exit "$comparison_exit"
          fi
          cat "$RUNNER_TEMP/relay-cumulative-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"])
          result = json.loads((base / "relay-cumulative-result.json").read_text())
          module = json.loads((base / "dropped-module.json").read_text())
          assert result["status"] in {"COMPARISON_CONFIRMED", "OBSERVED_DIFFERENT_RESULT"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Synthetic cumulative-budget comparison\n\n")
              out.write("No model turns. Native paths and separate local byte estimates are distinct.\n\n")
              out.write("```json\n" + json.dumps(result, indent=2) + "\n```\n")
              out.write("Registry provenance: " + module["Version"] + " " + module["Sum"] + "\n")
          PY
          exit "$comparison_exit"
